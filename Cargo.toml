[package]
name = "forge"
version = "0.1.0"
edition = "2021"
description = "A from-scratch, deterministic, headless-testable 2D game engine with zero dependencies"
license = "MIT"
repository = "https://github.com/pavanchow/forge"

[[bin]]
name = "forge"
path = "src/bin/forge.rs"

[profile.release]
opt-level = 3
lto = true

[lints.clippy]
# The engine is deliberately dependency-free and self-contained.
